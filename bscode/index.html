<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BsCode — Download</title>
  <meta name="description" content="Download BsCode, a living desktop for coordinating Codex, Claude, and shell agents." />
  <link rel="canonical" href="https://www.alex-dils.com/bscode" />
  <meta property="og:title" content="BsCode" />
  <meta property="og:description" content="Run and coordinate Codex, Claude, and shell agents in one living desktop workspace." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.alex-dils.com/bscode" />
  <meta property="og:image" content="https://www.alex-dils.com/bscode/social-preview.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="BsCode" />
  <meta name="twitter:description" content="Run and coordinate Codex, Claude, and shell agents in one living desktop workspace." />
  <meta name="twitter:image" content="https://www.alex-dils.com/bscode/social-preview.png" />
  <meta name="theme-color" content="#0c0f16" />
  <link rel="icon" href="/bscode/icon.png" type="image/png" />
  <style>
    :root {
      --bg: #0c0f16;
      --panel: #141923;
      --line: #293142;
      --text: #f4f7fb;
      --muted: #9aa5b5;
      --blue: #70b7ff;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background: var(--bg);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }
    button { color: inherit; font: inherit; }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    .github {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      margin-top: 22px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: border-color 140ms ease, color 140ms ease, transform 140ms ease;
    }

    .github:hover {
      border-color: #45516a;
      color: var(--text);
      transform: translateY(-1px);
    }

    .github svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .hero {
      padding: 84px 0 52px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(56px, 12vw, 92px);
      font-weight: 650;
      letter-spacing: -0.065em;
      line-height: 0.95;
    }

    .intro {
      max-width: 540px;
      margin: 24px auto 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
    }

    .install {
      margin-top: 38px;
      text-align: left;
    }

    .install-label {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .command {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 64px;
      padding: 16px 78px 16px 18px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 18px 70px rgba(0,0,0,0.28);
    }

    .command::before {
      flex: none;
      margin-right: 10px;
      color: var(--blue);
      content: "$";
      font-family: var(--mono);
      font-size: 13px;
    }

    code {
      color: #e0e8f4;
      font-family: var(--mono);
      font-size: 12px;
      white-space: nowrap;
    }

    .copy {
      position: absolute;
      top: 12px;
      right: 12px;
      height: 38px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #1b2230;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .copy:hover { border-color: #45516a; }

    .hint {
      margin: 11px 0 0;
      color: #6f7a8c;
      font-size: 11px;
      text-align: center;
    }

    .preview {
      margin: 62px 0 0;
      overflow: visible;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .preview video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: transparent;
      cursor: pointer;
    }

    footer {
      margin-top: 24px;
      color: #6f7a8c;
      font-size: 11px;
      text-align: center;
    }

    footer a { color: var(--muted); text-underline-offset: 3px; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

    @media (max-width: 560px) {
      main { padding-top: 28px; }
      .hero { padding-top: 84px; }
      .command { padding-right: 66px; }
      code { font-size: 10px; }
      .copy { padding: 0 10px; }
      .preview { margin-top: 46px; border-radius: 9px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>BsCode</h1>
      <a class="github" href="https://github.com/axel-slid/bscode" target="_blank" rel="noreferrer" aria-label="BsCode source code on GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .8a11.2 11.2 0 0 0-3.54 21.83c.56.1.77-.24.77-.54v-1.9c-3.14.68-3.8-1.34-3.8-1.34-.52-1.3-1.26-1.65-1.26-1.65-1.02-.7.08-.68.08-.68 1.13.08 1.73 1.16 1.73 1.16 1 .1 2.63.9 3.28.55.1-.73.4-1.23.72-1.51-2.5-.29-5.14-1.25-5.14-5.57 0-1.23.44-2.24 1.16-3.03-.12-.29-.5-1.44.11-2.99 0 0 .95-.3 3.1 1.16A10.8 10.8 0 0 1 12 5.91c.96 0 1.92.13 2.82.38 2.15-1.46 3.1-1.16 3.1-1.16.61 1.55.23 2.7.11 2.99.72.79 1.16 1.8 1.16 3.03 0 4.33-2.64 5.28-5.15 5.56.41.35.77 1.04.77 2.1v3.12c0 .3.2.65.78.54A11.2 11.2 0 0 0 12 .8Z"></path>
        </svg>
        <span>Open source on GitHub</span>
      </a>
      <p class="intro">Run Codex, Claude, and shell agents together across local or SSH workspaces in one living desktop.</p>

      <div class="install">
        <p class="install-label">Paste this into Terminal</p>
        <div class="command">
          <code id="install-command">curl -fsSL https://alex-dils.com/bscode/install.sh | bash</code>
          <button class="copy" type="button" aria-label="Copy install command">Copy</button>
        </div>
        <p class="hint">macOS · Apple Silicon · v0.2.5</p>
      </div>
    </section>

    <figure class="preview">
      <video
        id="bscode-film"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        poster="/bscode/bscode-digital-twin-poster.png"
        aria-label="BsCode coordinating multiple agents, entering Cinematic Mode, and switching to City View"
      >
        <source src="/bscode/bscode-digital-twin-alpha.mov" type='video/mp4; codecs="hvc1"' />
        <source src="/bscode/bscode-digital-twin.webm" type="video/webm" />
        <source src="/bscode/bscode-digital-twin.mp4" type="video/mp4" />
      </video>
    </figure>

    <footer>
      Free and open source · <a href="https://github.com/axel-slid/bscode" target="_blank" rel="noreferrer">View the code on GitHub</a>
    </footer>
  </main>

  <script>
    const button = document.querySelector(".copy");
    const command = document.getElementById("install-command");
    const film = document.getElementById("bscode-film");

    film.play().catch(function () {});
    film.addEventListener("click", function () {
      if (film.paused) {
        film.play().catch(function () {});
      } else {
        film.pause();
      }
    });

    button.addEventListener("click", async function () {
      const original = button.textContent;
      try {
        await navigator.clipboard.writeText(command.textContent.trim());
        button.textContent = "Copied";
      } catch (error) {
        const range = document.createRange();
        range.selectNodeContents(command);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        button.textContent = "Selected";
      }
      window.setTimeout(function () { button.textContent = original; }, 1500);
    });
  </script>
</body>
</html>
