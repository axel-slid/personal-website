<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BsCode — The workspace for coding agents</title>
  <meta name="description" content="Run, direct, and review Codex, Claude, and shell agents together across local and SSH workspaces.">
  <link rel="canonical" href="https://alex-dils.com/bscode/">
  <meta property="og:title" content="BsCode — The workspace for coding agents">
  <meta property="og:description" content="Run, direct, and review coding agents together in one desktop workspace.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://alex-dils.com/bscode/">
  <meta property="og:image" content="https://alex-dils.com/assets/bscode/motion/bscode-overview-poster.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../assets/bscode/app-icon.png">
  <link rel="apple-touch-icon" href="../assets/bscode/app-icon.png">
  <link rel="preload" href="../assets/bscode/motion/bscode-overview-poster.jpg" as="image" fetchpriority="high">
  <link rel="stylesheet" href="bscode.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "BsCode",
    "softwareVersion": "0.2.3",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "macOS",
    "description": "A desktop workspace for running and organizing Codex, Claude, and shell agents.",
    "author": {"@type": "Person", "name": "Alex Dils", "url": "https://alex-dils.com/"},
    "downloadUrl": "https://github.com/axel-slid/bscode/releases/latest/download/BsCode-macOS-arm64.zip",
    "codeRepository": "https://github.com/axel-slid/bscode"
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#product-demo">Skip to product demo</a>

  <header class="site-header">
    <a class="product-brand" href="./" aria-label="BsCode home">
      <img src="../assets/bscode/app-icon.png" alt="" width="34" height="34">
      <span>BsCode</span>
    </a>
    <div class="header-actions">
      <details class="install-help">
        <summary>First launch</summary>
        <div class="install-popover">
          <p>After moving BsCode to Applications, run:</p>
          <div class="install-command">
            <code id="quarantineCommand">xattr -dr com.apple.quarantine "/Applications/BsCode.app"</code>
            <button id="copyQuarantineCommand" type="button">Copy</button>
          </div>
        </div>
      </details>
      <a class="header-download" href="https://github.com/axel-slid/bscode/releases/latest/download/BsCode-macOS-arm64.zip">
        Download for Apple silicon <span aria-hidden="true">↓</span>
      </a>
    </div>
  </header>

  <main id="product-demo" class="product-demo">
    <h1 class="sr-only">BsCode</h1>
    <figure class="demo-frame">
      <video
        id="bscodeOverview"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        disablepictureinpicture
        poster="../assets/bscode/motion/bscode-overview-poster.jpg"
        aria-describedby="demo-description"
      >
        <source src="../assets/bscode/motion/bscode-overview.mp4" type="video/mp4">
        <a href="../assets/bscode/motion/bscode-overview.mp4">Watch the BsCode product demo</a>
      </video>
      <figcaption id="demo-description" class="sr-only">
        An animated BsCode tour cycling through parallel agent terminals, Cinematic mode, and the Pixel tower.
      </figcaption>
    </figure>
  </main>

  <script>
    (() => {
      const demo = document.getElementById("bscodeOverview");
      const copyButton = document.getElementById("copyQuarantineCommand");
      const quarantineCommand = document.getElementById("quarantineCommand");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const syncPlayback = () => {
        if (reducedMotion.matches || document.hidden) {
          demo.pause();
          return;
        }
        demo.play().catch(() => {});
      };
      reducedMotion.addEventListener?.("change", syncPlayback);
      document.addEventListener("visibilitychange", syncPlayback);
      copyButton.addEventListener("click", async () => {
        await navigator.clipboard.writeText(quarantineCommand.textContent);
        copyButton.textContent = "Copied";
        window.setTimeout(() => {
          copyButton.textContent = "Copy";
        }, 1400);
      });
      syncPlayback();
    })();
  </script>
</body>
</html>
