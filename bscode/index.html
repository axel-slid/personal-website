<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BsCode</title>
  <meta name="description" content="BsCode is a live coding command center for Codex, Claude, shell sessions, local files, and SSH workspaces.">
  <link rel="canonical" href="https://www.alex-dils.com/bscode/">
  <meta property="og:title" content="BsCode">
  <meta property="og:description" content="A live coding command center for macOS.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.alex-dils.com/bscode/">
  <meta property="og:image" content="https://www.alex-dils.com/assets/bscode/motion/bscode-digital-twin-poster.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="BsCode">
  <meta name="twitter:description" content="A live coding command center for macOS.">
  <meta name="twitter:image" content="https://www.alex-dils.com/assets/bscode/motion/bscode-digital-twin-poster.jpg">
  <meta name="theme-color" content="#070b12">
  <link rel="icon" href="../assets/bscode/app-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/bscode/app-icon.png">
  <link rel="preload" href="../assets/bscode/motion/bscode-digital-twin-poster.jpg" as="image" fetchpriority="high">
  <link rel="stylesheet" href="bscode.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "BsCode",
    "softwareVersion": "0.2.5",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "macOS",
    "description": "A live coding command center for directing Codex, Claude, and shell agents across local and SSH workspaces.",
    "author": {"@type": "Person", "name": "Alex Dils", "url": "https://www.alex-dils.com/"},
    "downloadUrl": "https://github.com/axel-slid/bscode/releases/latest/download/BsCode-macOS-arm64.zip",
    "codeRepository": "https://github.com/axel-slid/bscode"
  }
  </script>
</head>
<body>
  <div class="digital-twin" aria-hidden="true">
    <video
      id="bscodeDigitalTwin"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      disablepictureinpicture
      poster="../assets/bscode/motion/bscode-digital-twin-poster.jpg"
    >
      <source src="../assets/bscode/motion/bscode-digital-twin.mp4" type="video/mp4">
    </video>
  </div>
  <div class="video-wash" aria-hidden="true"></div>
  <div class="cinematic-bars" aria-hidden="true"></div>

  <aside class="film-caption" aria-label="Current product film scene">
    <span id="sceneEyebrow">The workspace</span>
    <p id="sceneCaption">Four coding agents run side by side while their terminals stay visible.</p>
  </aside>

  <main>
    <h1>BsCode</h1>
    <button class="install-command" id="copyInstall" type="button" aria-label="Copy the BsCode install command">
      <span class="prompt" aria-hidden="true">$</span>
      <code id="installCommand">curl -fsSL https://alex-dils.com/bscode/install.sh | bash</code>
      <span class="copy-label" id="copyLabel" aria-live="polite">Copy</span>
    </button>
  </main>

  <script src="bscode.js"></script>
</body>
</html>
